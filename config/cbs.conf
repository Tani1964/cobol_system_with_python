# ================================================================
# COBOL Core Banking System - runtime configuration
# Read by CONFIG-LOAD (KEY=VALUE, '#' starts a comment line).
# Override the location with the CBS_CONFIG_FILE environment
# variable. Missing file / bad values fall back to built-in
# defaults and a warning is shown - never silently.
# Personal project: all values are illustrative.
# ================================================================
BANK_NAME=COBOL COMMUNITY BANK (DEMO)
DEFAULT_CURRENCY=USD
SUPPORTED_CURRENCIES=USD,EUR,GBP,NGN
# Upper bound for a single deposit/withdrawal/transfer.
MAX_TRANSACTION_AMOUNT=1000000.00
# Highest overdraft limit that may be granted to a CURRENT account.
# SAVINGS accounts always have an overdraft limit of zero.
MAX_OVERDRAFT_LIMIT=5000.00
# Transactions at or above this value are listed in the daily
# report's exception section for review.
LARGE_TRANSACTION_THRESHOLD=10000.00
